<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Campus Media - ABC College</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <header class="header">

        <div class="header-content">

            <img src="media/college.jpg"
                 alt="College Campus"
                 class="college-logo">

            <div>

                <h1>ABC College of Engineering</h1>

                <p>Campus Media</p>

            </div>

        </div>

    </header>


    <nav class="navbar">

        <a href="index.html">Home</a>

        <a href="admission.html">Admission</a>

        <a href="courses.html">Courses</a>

        <a href="media.html">Campus Media</a>

        <a href="contact.html">Contact</a>

    </nav>


    <main class="section">

        <h2>College Campus Media</h2>


        <!-- IMAGE -->

        <div class="media-card">

            <h3>📷 College Campus</h3>

            <img
                src="./media/college.jpg"
                alt="ABC College Campus"
                class="campus-image">

        </div>


        <!-- VIDEO -->

        <div class="media-card">

            

            <p>
                Watch our college campus introduction.
            </p>

            <h3>🎥 ABC College of Engineering - Campus Video</h3>
            <video class="college-video" controls>
    <source
        src="https://edshare.gla.ac.uk/365/1.hasvideo_mp4ThumbnailVersion/Sample%20course%20promo%20video%20%28final%29.mp4"
        type="video/mp4">

    Your browser does not support HTML5 video.
</video>


        </div>


        <!-- AUDIO -->

        <div class="media-card">

            <h3>🎵 College Audio</h3>

            <p>
                Listen to our college audio.
            </p>

            <audio
                class="college-audio"
                controls
                preload="metadata">

                <source
                    src="./media/college-audio.mp3"
                    type="audio/mpeg">

                Your browser does not support
                the HTML5 audio element.

            </audio>

        </div>

    </main>


    <footer>

        <p>© 2026 ABC College of Engineering</p>

    </footer>

</body>

</html>
