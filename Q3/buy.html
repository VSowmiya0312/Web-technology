<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StyleHub - Buy Now</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            STYLEHUB
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="shop.html">Shop</a>

            <a href="features.html">Features</a>

            <a href="offers.html">Offers</a>

            <a href="contact.html">Contact</a>

        </nav>

    </header>


    <!-- BUY PAGE -->

    <section class="buy-section">

        <div class="buy-box">

            <h1>Complete Your Order</h1>

            <p>
                Enter your details to place your order.
            </p>


            <form>

                <input
                    type="text"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="tel"
                    placeholder="Phone Number"
                    required
                >

                <textarea
                    placeholder="Delivery Address"
                    rows="5"
                    required>
                </textarea>


                <select required>

                    <option value="">
                        Select Payment Method
                    </option>

                    <option>
                        Cash on Delivery
                    </option>

                    <option>
                        UPI
                    </option>

                    <option>
                        Credit / Debit Card
                    </option>

                </select>


                <button type="submit">
                    Place Order
                </button>

            </form>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <h3>STYLEHUB</h3>

        <p>
            © 2026 StyleHub. All Rights Reserved.
        </p>

    </footer>

</body>

</html>
