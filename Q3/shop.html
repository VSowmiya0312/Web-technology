<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StyleHub - Shop</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            STYLEHUB
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="shop.html" class="active">
                Shop
            </a>

            <a href="features.html">
                Features
            </a>

            <a href="offers.html">
                Offers
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>

    </header>


    <!-- PAGE TITLE -->

    <section class="page-banner">

        <h1>Our Collection</h1>

        <p>
            Explore our latest fashion products
        </p>

    </section>


    <!-- PRODUCTS -->

    <section>

        <div class="section-title">

            <h2>Trending Collection</h2>

            <p>
                Choose your favorite style
            </p>

        </div>


        <div class="products">


            <!-- PRODUCT 1 -->

            <div class="product-card">

                <img src="images/product1.jpg"
                     alt="Women's Fashion">

                <div class="product-info">

                    <h3>Women's Fashion</h3>

                    <p class="price">
                        ₹1,499
                    </p>

                    <button>
                        Buy Now
                    </button>

                </div>

            </div>


            <!-- PRODUCT 2 -->

            <div class="product-card">

                <img src="images/product2.jpg"
                     alt="Summer Dress">

                <div class="product-info">

                    <h3>Summer Dress</h3>

                    <p class="price">
                        ₹1,999
                    </p>

                    <button>
                        Buy Now
                    </button>

                </div>

            </div>


            <!-- PRODUCT 3 -->

            <div class="product-card">

                <img src="images/product3.jpg"
                     alt="Casual Wear">

                <div class="product-info">

                    <h3>Casual Wear</h3>

                    <p class="price">
                        ₹1,299
                    </p>

                    <button>
                        Buy Now
                    </button>

                </div>

            </div>


            <!-- PRODUCT 4 -->

            <div class="product-card">

                <img src="images/product4.jpg"
                     alt="New Arrivals">

                <div class="product-info">

                    <h3>New Arrivals</h3>

                    <p class="price">
                        ₹2,499
                    </p>

                    <button>
                        Buy Now
                    </button>

                </div>

            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <h3>STYLEHUB</h3>

        <p>
            © 2026 StyleHub. All Rights Reserved.
        </p>

    </footer>

</body>

</html>
