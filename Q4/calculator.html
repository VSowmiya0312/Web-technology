<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate Grade</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Student Grade Calculator</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="calculator.html">Calculator</a>
        <a href="result.html">Result</a>
    </nav>
</header>

<div class="container">

    <h2>Enter Student Details</h2>

    <label>Student Name</label>
    <input type="text" id="studentName" placeholder="Enter student name">

    <label>Subject 1 - Mathematics</label>
    <input type="number" id="mark1" min="0" max="100">

    <label>Subject 2 - Science</label>
    <input type="number" id="mark2" min="0" max="100">

    <label>Subject 3 - English</label>
    <input type="number" id="mark3" min="0" max="100">

    <label>Subject 4 - Computer Science</label>
    <input type="number" id="mark4" min="0" max="100">

    <label>Subject 5 - Social Science</label>
    <input type="number" id="mark5" min="0" max="100">

    <button onclick="calculateGrade()">Calculate Grade</button>

</div>

<footer>
    <p>Student Grade Calculator</p>
</footer>

<script src="script.js"></script>

</body>
</html>
